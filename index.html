    .drag-clock{touch-action:none;user-select:none;-webkit-user-select:none}.hand-hit{stroke:transparent;stroke-width:54;stroke-linecap:round;pointer-events:stroke;cursor:grab}.hand-knob{cursor:grab}.drag-clock.dragging .hand-hit,.drag-clock.dragging .hand-knob{cursor:grabbing}.hand-focus:focus-visible{outline:none}.hand-focus:focus-visible .hand-glow{stroke:#ffae3e;stroke-width:5}.instruction{display:flex;align-items:center;gap:10px;margin:12px 0 0;background:#fff1cd;color:#744713;border-radius:14px;padding:10px 14px;font-weight:900;line-height:1.45}.instruction-icon{font-size:1.45rem}.instruction strong{color:#d15a25}.stage-actions{margin-top:12px}

    .practice{padding:24px;min-height:540px}.practice-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:.84rem;color:#5881a2;font-weight:900;letter-spacing:.06em}.practice h2{font-size:clamp(1.3rem,2.4vw,1.8rem);margin:6px 0 20px}.practice-grid{display:grid;grid-template-columns:minmax(320px,.95fr) minmax(0,1.05fr);gap:clamp(20px,3vw,40px);align-items:center}.practice-clock{width:min(100%,420px);aspect-ratio:1;margin:auto}.practice-clock-label{text-align:center;font-size:clamp(1.5rem,2.7vw,1.85rem);line-height:1.35;font-weight:900;color:#1d476d;margin:12px 0 0}#practice-readout{display:table;margin:12px auto 0;padding:9px 20px;border-radius:14px;background:#fff0ce;color:#b74d19;font-size:clamp(1.55rem,3vw,2rem)}.feedback{margin-top:20px;border-radius:18px;padding:16px 18px;background:#e9f6fc;font-weight:800;line-height:1.65;min-height:90px}.feedback.success{background:#e4f8ec;color:#16603b}.feedback.retry{background:#fff4e6;color:#8e4b17}.practice-steps{margin:12px 0 0;padding-left:1.4em;font-size:.92rem;font-weight:700;line-height:1.6}.next-question-area{margin-top:34px;padding-top:24px;border-top:2px solid #d7e8f5}.new-question{margin:0;min-width:220px}.hidden{display:none!important}
    @media(max-width:980px){.study-layout{grid-template-columns:1fr}.guide{border-left:0;border-top:2px solid #e0edf7}.guide .steps{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.tip{margin-top:16px}.control-bar{gap:14px}.stage{padding:18px}}

<body>
  <main class="app">
    <header class="header"><div class="brand"><div class="brand-mark" aria-hidden="true">◷</div><div><h1>とけいのたび</h1><small>時計と時こく</small></div></div><div class="header-note">小学校３年生の算数</div></header>
    <div class="tabs" role="tablist" aria-label="学習のしかた"><button class="tab" id="tab-explore" role="tab" aria-selected="true" aria-controls="explore">時計をうごかす</button><button class="tab" id="tab-practice" role="tab" aria-selected="false" aria-controls="practice">もんだいにちょうせん</button></div>
    <section class="panel explore" id="explore" role="tabpanel" aria-labelledby="tab-explore">
      <div class="control-bar">
        <div class="control-group"><span class="group-label">① はじめの時こく</span><div class="time-select"><select id="start-hour" aria-label="はじめの時"></select>時 <select id="start-minute" aria-label="はじめの分"></select>分</div></div>
        <div class="control-group"><span class="group-label">② どちらにうごかす？</span><div class="operation-grid" id="operations"><button class="op-button active" data-op="after-min" aria-pressed="true">何分後</button><button class="op-button" data-op="before-min" aria-pressed="false">何分前</button><button class="op-button" data-op="after-hour" aria-pressed="false">何時間後</button><button class="op-button" data-op="before-hour" aria-pressed="false">何時間前</button></div></div>
        <div class="control-group"><span class="group-label">③ どれくらい？</span><div class="amount-control"><button class="stepper" id="amount-down" aria-label="数をへらす">−</button><span class="amount-value" id="amount-value">35分</span><button class="stepper" id="amount-up" aria-label="数をふやす">＋</button></div></div>
      </div>
      <div class="study-layout"><div class="stage"><p class="question-label">いっしょに やってみよう</p><h2 class="question" id="explore-question"></h2><div class="clocks"><div class="clock-card"><div class="clock-caption">はじめ</div><div class="clock-wrap" id="start-clock"></div><div class="time-readout" id="start-readout"></div></div><div class="travel-sign" id="travel-sign" aria-hidden="true">→</div><div class="clock-card current"><div class="clock-caption" id="current-caption">うごかす時計</div><div class="clock-wrap" id="current-clock"></div><div class="time-readout" id="current-readout" aria-live="polite"></div></div></div><p class="instruction" id="explore-instruction"><span class="instruction-icon" aria-hidden="true">☝</span><span></span></p><div class="progress" role="progressbar" aria-label="時計をうごかした量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="progress-fill" id="progress-fill"></div></div><p class="progress-text" id="progress-text"></p><div class="stage-actions"><button class="secondary" id="reset" disabled>はじめにもどす</button></div></div><aside class="guide"><h2>時計のうごき</h2><p class="guide-intro">はりを回すと、時こくもいっしょに変わるよ。</p><div class="steps" id="steps"></div><div class="tip" id="tip"></div></aside></div>
    </section>
    <section class="panel practice hidden" id="practice" role="tabpanel" aria-labelledby="tab-practice"><div class="practice-top"><span class="eyebrow">はりを回して こたえよう</span><span class="eyebrow" id="question-count"></span></div><h2 id="practice-question"></h2><div class="practice-grid"><div><div class="practice-clock" id="practice-clock"></div><p class="practice-clock-label" id="practice-start"></p><p class="practice-clock-label" id="practice-readout" aria-live="polite"></p></div><div><p class="instruction" id="practice-instruction"><span class="instruction-icon" aria-hidden="true">☝</span><span></span></p><div class="feedback" id="feedback" role="status" aria-live="polite">時計のはりを回して、時こくをたしかめよう。</div><div class="stage-actions"><button class="primary" id="check-answer">こたえあわせ</button><button class="secondary" id="practice-reset">はじめにもどす</button></div><div class="next-question-area"><button class="secondary new-question" id="new-question">つぎの もんだい</button></div></div></div></section>
  </main>
  <script>
    const $=id=>document.getElementById(id);
    const mod=n=>(n%720+720)%720;
    const hourOf=t=>Math.floor(mod(t)/60)||12;
    const minuteOf=t=>mod(t)%60;
    const timeText=t=>`${hourOf(t)}時${minuteOf(t)===0?'ちょうど':minuteOf(t)+'分'}`;
    const clockText=t=>`${hourOf(t)}時${String(minuteOf(t)).padStart(2,'0')}分`;
    const elapsedMinutes=(moved,isHour)=>Math.round(moved*(isHour?60:1));
    const durationText=minutes=>`${Math.floor(minutes/60)?Math.floor(minutes/60)+'時間':''}${minutes%60?minutes%60+'分':minutes===0?'0分':''}`;
    const ops={"after-min":{dir:1,unit:"分",end:"後"},"before-min":{dir:-1,unit:"分",end:"前"},"after-hour":{dir:1,unit:"時間",end:"後"},"before-hour":{dir:-1,unit:"時間",end:"前"}};
    const state={start:3*60+40,op:"after-min",amount:35,moved:0,raw:0,steps:[]};
    const coords=(angle,r)=>({x:150+Math.sin(angle*Math.PI/180)*r,y:150-Math.cos(angle*Math.PI/180)*r});
    function clockSvg(t,label,activeHand=null,max=0,moved=0){
      const marks=Array.from({length:60},(_,i)=>{const a=coords(i*6,i%5===0?119:123),b=coords(i*6,129);return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${i%5===0?'#668aaa':'#bfd2e0'}" stroke-width="${i%5===0?3:1.5}" stroke-linecap="round"/>`}).join('');
      const nums=Array.from({length:12},(_,i)=>{const n=i+1,p=coords(n*30,101);return `<text x="${p.x}" y="${p.y}" dominant-baseline="central" text-anchor="middle" font-size="21" font-weight="900" fill="#1d4368">${n}</text>`}).join('');
      const ha=(hourOf(t)%12)*30+minuteOf(t)*.5,ma=minuteOf(t)*6;
      const hand=(kind,angle)=>{const minute=kind==='minute',selected=kind===activeHand,tip=minute?54:83,color=minute?'#ef783b':'#1a4772';return `<g data-hand="${kind}" transform="rotate(${angle} 150 150)" ${selected?`class="hand-focus" tabindex="0" role="slider" aria-label="${minute?'長い':'短い'}はりを回す" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${moved}" aria-valuetext="${clockText(t)}"`:''}><line x1="150" y1="${minute?162:157}" x2="150" y2="${tip}" stroke="${color}" stroke-width="${minute?7:11}" stroke-linecap="round"/>${selected?`<circle class="hand-glow" cx="150" cy="${tip}" r="22" fill="#fff8e9" stroke="${color}" stroke-width="3"/><circle class="hand-knob" cx="150" cy="${tip}" r="12" fill="${color}"/><line class="hand-hit" x1="150" y1="145" x2="150" y2="${tip}"/></g>`:'</g>'}`};
      const hands=activeHand==='hour'?hand('minute',ma)+hand('hour',ha):hand('hour',ha)+hand('minute',ma);
      return `<svg class="clock-svg ${activeHand?'drag-clock':''}" viewBox="0 0 300 300" role="${activeHand?'group':'img'}" aria-label="${label} ${clockText(t)}"><circle cx="150" cy="150" r="145" fill="#d7e8f5"/><circle cx="150" cy="145" r="140" fill="#fff" stroke="#2d6594" stroke-width="7"/>${marks}${nums}${hands}<circle cx="150" cy="150" r="8" fill="#1a4772"/><circle cx="150" cy="150" r="3.5" fill="#fff"/></svg>`;
    }
    function updateClock(container,t,max,moved){
      const svg=container.querySelector('svg');if(!svg)return;
      svg.setAttribute('aria-label',`うごかす時計 ${clockText(t)}`);
      svg.querySelector('[data-hand="hour"]').setAttribute('transform',`rotate(${(hourOf(t)%12)*30+minuteOf(t)*.5} 150 150)`);
      svg.querySelector('[data-hand="minute"]').setAttribute('transform',`rotate(${minuteOf(t)*6} 150 150)`);
      const slider=svg.querySelector('[role="slider"]');slider.setAttribute('aria-valuemax',max);slider.setAttribute('aria-valuenow',moved);slider.setAttribute('aria-valuetext',clockText(t));
    }
    function makeSteps(start,op,amount){
      const {dir,unit}=ops[op];let time=start,remaining=amount,steps=[];
      if(unit==='時間'){
        for(let i=0;i<amount;i++){time=mod(time+dir*60);steps.push({time,minutes:60,label:`1時間${dir===1?'すすむ':'もどる'}`});}
      }else{
        while(remaining>0){const m=minuteOf(time);let until=dir===1?60-m:m;if(until===0)until=60;const n=Math.min(remaining,until);time=mod(time+dir*n);remaining-=n;steps.push({time,minutes:n,label:`${n}分${dir===1?'すすむ':'もどる'}`});}
      }
      return steps;
    }
    function rebuild(){state.moved=0;state.raw=0;state.steps=makeSteps(state.start,state.op,state.amount);renderExplore(true);}
    function renderExplore(resetClock=false){
      const o=ops[state.op],isHour=o.unit==='時間',elapsed=elapsedMinutes(state.moved,isHour),total=state.amount*(isHour?60:1),done=elapsed===total;
      const current=mod(state.start+o.dir*elapsed);
      $('explore-question').textContent=`${timeText(state.start)}から ${state.amount}${o.unit}${o.end}は？`;
      if(resetClock){$('start-clock').innerHTML=clockSvg(state.start,'はじめ');$('current-clock').innerHTML=clockSvg(current,'うごかす時計','minute',total,0);}
      else updateClock($('current-clock'),current,total,elapsed);
      $('start-readout').textContent=clockText(state.start);$('current-readout').textContent=clockText(current);$('current-caption').textContent=done?'こたえ':'うごかす時計';
      $('travel-sign').textContent=o.dir===1?'→':'←';$('amount-value').textContent=state.amount+o.unit;
      const pct=Math.round(elapsed/total*100);
      $('progress-fill').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);
      $('progress-text').textContent=done?'できた！ 時計のはりと時こくをたしかめよう。':`${durationText(elapsed)} うごかしたよ。あと ${durationText(total-elapsed)}。`;
      let passed=0;$('steps').innerHTML=state.steps.map((s,i)=>{passed+=s.minutes;const complete=elapsed>=passed,active=!complete&&elapsed>=passed-s.minutes;return `<div class="step ${complete?'done':active?'next':''}"><span class="step-number">${complete?'✓':i+1}</span><span class="step-copy">${complete||active?s.label:'つぎの 1歩'}<small>${complete?clockText(s.time):active?`あと ${durationText(passed-elapsed)} で この区切り`:'まだ ひみつ'}</small></span></div>`;}).join('');
      $('tip').innerHTML=isHour?'長いはりが<strong>1周すると1時間</strong>。その間に短いはりは数字を1つ進むよ。':done?'長いはりが数字を1つ進むと <strong>5分</strong>。時をまたいだら、短いはりも次の時に進むよ。':'<strong>○時ちょうど</strong> を通るときは、そこで分けて考えるとわかりやすいよ。';
      $('explore-instruction').lastElementChild.innerHTML=done?'ぴったりの時こくまで うごかせたね！':`右の時計の <strong>オレンジの長いはり</strong> を指でつかみ、${o.dir===1?'右回り':'左回り'}に回そう。${isHour?'1周で1時間だよ。':''}`;
      $('reset').disabled=elapsed===0;
      document.querySelectorAll('.op-button').forEach(b=>{const active=b.dataset.op===state.op;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
    }
    for(let h=1;h<=12;h++)$('start-hour').add(new Option(h,h));
    for(let m=0;m<60;m+=5)$('start-minute').add(new Option(String(m).padStart(2,'0'),m));
    $('start-hour').value=3;$('start-minute').value=40;
    function changeStart(){state.start=(Number($('start-hour').value)%12)*60+Number($('start-minute').value);rebuild();}
    $('start-hour').addEventListener('change',changeStart);$('start-minute').addEventListener('change',changeStart);
    $('operations').addEventListener('click',e=>{const b=e.target.closest('[data-op]');if(!b)return;const wasHour=ops[state.op].unit==='時間';state.op=b.dataset.op;if(wasHour!== (ops[state.op].unit==='時間'))state.amount=ops[state.op].unit==='時間'?2:35;rebuild();});
    function changeAmount(delta){const max=ops[state.op].unit==='時間'?11:120;state.amount=Math.max(1,Math.min(max,state.amount+delta));rebuild();}
    $('amount-down').addEventListener('click',()=>changeAmount(-1));$('amount-up').addEventListener('click',()=>changeAmount(1));
    $('reset').addEventListener('click',()=>{state.moved=0;state.raw=0;renderExplore();});
    function switchTab(name){for(const key of ['explore','practice']){const active=key===name;$('tab-'+key).setAttribute('aria-selected',String(active));$(key).classList.toggle('hidden',!active);}if(name==='practice'&&!practice.question)newQuestion();}
    $('tab-explore').addEventListener('click',()=>switchTab('explore'));$('tab-practice').addEventListener('click',()=>switchTab('practice'));
    document.querySelector('.tabs').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const name=$('tab-explore').getAttribute('aria-selected')==='true'?'practice':'explore';switchTab(name);$('tab-'+name).focus();}});
    const practice={question:null,count:0,moved:0,raw:0};
    const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
    function practiceTime(){const q=practice.question,o=ops[q.op];return mod(q.start+o.dir*elapsedMinutes(practice.moved,o.unit==='時間'));}
    function renderPractice(resetClock=false){
      const q=practice.question,o=ops[q.op],hour=o.unit==='時間',t=practiceTime(),max=hour?11*60:120,elapsed=elapsedMinutes(practice.moved,hour);
      if(resetClock)$('practice-clock').innerHTML=clockSvg(t,'もんだいの時計','minute',max,elapsed);
      else updateClock($('practice-clock'),t,max,elapsed);
      $('practice-readout').textContent=`いま ${clockText(t)}`;
      $('practice-instruction').lastElementChild.innerHTML=`<strong>オレンジの長いはり</strong> を${o.dir===1?'右回り':'左回り'}に回そう。${hour?'1周で1時間だよ。':''}`;
      $('practice-reset').disabled=elapsed===0;
    }
    function newQuestion(){
      const op=Object.keys(ops)[rand(0,3)],o=ops[op],start=(rand(1,12)%12)*60+rand(0,11)*5,amount=o.unit==='時間'?rand(1,3):[10,15,20,25,30,35,40,45,50][rand(0,8)];
      const correct=mod(start+o.dir*amount*(o.unit==='時間'?60:1));
      practice.question={start,op,amount,correct};practice.count++;practice.moved=0;practice.raw=0;
      $('question-count').textContent=`第 ${practice.count} 問`;
      $('practice-question').textContent=`${timeText(start)}の ${amount}${o.unit}${o.end}は 何時何分？`;
      $('practice-start').textContent=`はじめは ${clockText(start)}`;renderPractice(true);
      $('feedback').className='feedback';$('feedback').textContent='時計のはりを回して、時こくをたしかめよう。';
    }
    $('check-answer').addEventListener('click',()=>{
      const q=practice.question,correct=practice.moved===q.amount;
      if(correct){const steps=makeSteps(q.start,q.op,q.amount);const lines=steps.map((s,i)=>`<li>${i===0?clockText(q.start):clockText(steps[i-1].time)} から ${s.label} → ${clockText(s.time)}</li>`).join('');$('feedback').className='feedback success';$('feedback').innerHTML=`せいかい！ <strong>${clockText(q.correct)}</strong> だね。<ol class="practice-steps">${lines}</ol>`;}
      else{$('feedback').className='feedback retry';$('feedback').textContent=`いまは ${clockText(practiceTime())}。${practice.moved<q.amount?'もう少し、同じ向きに':'少し、反対向きに'} はりを回してみよう。`;}
    });
    $('practice-reset').addEventListener('click',()=>{practice.moved=0;practice.raw=0;renderPractice();$('feedback').className='feedback';$('feedback').textContent='はじめの時こくにもどったよ。';});
    $('new-question').addEventListener('click',newQuestion);
    let drag=null;
    function pointerAngle(e,svg){const r=svg.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);if(Math.hypot(x,y)<r.width*.08)return null;return (Math.atan2(x,-y)*180/Math.PI+360)%360;}
    function moveFromAngle(raw,delta,operation,max){return Math.max(0,Math.min(max,raw+delta*operation.dir/(operation.unit==='時間'?360:6)));}
    function roundMoved(raw,operation){return operation.unit==='時間'?Math.round(raw*60)/60:Math.round(raw);}
    function installHandControl(id,mode){
      const container=$(id);
      container.addEventListener('pointerdown',e=>{
        if(drag||e.pointerType==='mouse'&&e.button!==0)return;
        const hand=e.target.closest('[data-hand]'),svg=container.querySelector('svg');
        if(!hand||!hand.classList.contains('hand-focus')||!svg)return;
        const angle=pointerAngle(e,svg);if(angle===null)return;
        e.preventDefault();hand.focus();svg.setPointerCapture(e.pointerId);svg.classList.add('dragging');drag={mode,pointerId:e.pointerId,svg,lastAngle:angle};
      });
      container.addEventListener('pointermove',e=>{
        if(!drag||drag.mode!==mode||drag.pointerId!==e.pointerId)return;
        e.preventDefault();
        const angle=pointerAngle(e,drag.svg);if(angle===null)return;
        let delta=angle-drag.lastAngle;if(delta>180)delta-=360;if(delta< -180)delta+=360;drag.lastAngle=angle;
        const unit=mode==='explore'?ops[state.op]:ops[practice.question.op],model=mode==='explore'?state:practice,max=mode==='explore'?state.amount:unit.unit==='時間'?11:120;
        model.raw=moveFromAngle(model.raw,delta,unit,max);
        const moved=roundMoved(model.raw,unit);
        if(moved!==model.moved){model.moved=moved;if(mode==='explore')renderExplore();else renderPractice();}
      });
      const end=e=>{if(drag?.mode!==mode||drag.pointerId!==e.pointerId)return;drag.svg.classList.remove('dragging');if(drag.svg.hasPointerCapture(e.pointerId))drag.svg.releasePointerCapture(e.pointerId);drag=null;const unit=mode==='explore'?ops[state.op]:ops[practice.question.op],model=mode==='explore'?state:practice;if(unit.unit==='時間'&&Math.abs(model.raw-Math.round(model.raw))<=3/60){model.raw=Math.round(model.raw);model.moved=model.raw;if(mode==='explore')renderExplore();else renderPractice();}};
      container.addEventListener('pointerup',end);container.addEventListener('pointercancel',end);
      container.addEventListener('keydown',e=>{
        if(!e.target.matches('[role="slider"]')||!['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key))return;
        e.preventDefault();const unit=mode==='explore'?ops[state.op]:ops[practice.question.op],model=mode==='explore'?state:practice,max=mode==='explore'?state.amount:unit.unit==='時間'?11:120;
        const clockwise=e.key==='ArrowRight'||e.key==='ArrowUp',step=unit.unit==='時間'?5/60:1;model.moved=Math.max(0,Math.min(max,Math.round((model.moved+(clockwise?unit.dir:-unit.dir)*step)*60)/60));model.raw=model.moved;
        if(mode==='explore')renderExplore();else renderPractice();
      });
    }
    installHandControl('current-clock','explore');installHandControl('practice-clock','practice');
    for(const type of ['gesturestart','gesturechange'])document.addEventListener(type,e=>e.preventDefault(),{passive:false});
    document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
    rebuild();
    if(document.modelContext?.registerTool){
      try{Promise.resolve(document.modelContext.registerTool({name:'configure_clock_lesson',title:'時計の学習を設定する',description:'はじめの時刻と何分後・何時間前などを設定し、画面の時計と学習手順を更新します。',inputSchema:{type:'object',properties:{hour:{type:'integer',minimum:1,maximum:12},minute:{type:'integer',minimum:0,maximum:55,multipleOf:5},operation:{type:'string',enum:Object.keys(ops)},amount:{type:'integer',minimum:1,maximum:120}},required:['hour','minute','operation','amount'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){const {hour,minute,operation,amount}=input??{};if(!Number.isInteger(hour)||hour<1||hour>12||!Number.isInteger(minute)||minute<0||minute>55||minute%5||!ops[operation]||!Number.isInteger(amount)||amount<1||amount>(ops[operation].unit==='時間'?11:120))throw new Error('時刻または動かす量が正しくありません');state.start=(hour%12)*60+minute;state.op=operation;state.amount=amount;$('start-hour').value=hour;$('start-minute').value=minute;switchTab('explore');rebuild();return {question:$('explore-question').textContent,steps:state.steps.length};}})).catch(()=>{});}catch(e){}
      try{Promise.resolve(document.modelContext.registerTool({name:'move_clock_hand',title:'時計のはりを動かす',description:'学習画面の選択中のはりを、はじめの時刻から指定した分または時間だけ動かします。',inputSchema:{type:'object',properties:{moved:{type:'integer',minimum:0,maximum:120}},required:['moved'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){const moved=input?.moved;if(!Number.isInteger(moved)||moved<0||moved>state.amount)throw new Error('動かす量が設定範囲外です');switchTab('explore');state.moved=moved;state.raw=moved;renderExplore();return {time:clockText(mod(state.start+ops[state.op].dir*moved*(ops[state.op].unit==='時間'?60:1))),complete:moved===state.amount};}})).catch(()=>{});}catch(e){}
    }
  </script>
</body>
